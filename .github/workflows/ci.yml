# Every job below invokes a root package.json script (`pnpm run ci:<name>`)
# rather than inlining a command, so a developer runs the identical thing on
# a local checkout -- see scripts/ci/README.md for the mapping. Every job
# either passes or fails the build outright -- no job is configured to
# tolerate or swallow a non-zero exit code, and no soft-fail setting appears
# anywhere in this file.
#
# Every gate job depends on `setup`, which proves the frozen-lockfile install
# itself succeeds before any gate runs against it. Because GitHub Actions
# runners don't share a filesystem across jobs, each gate job repeats the
# same checkout/Node/pnpm-install sequence `setup` uses (this is the "shared
# setup" every job depends on: identical steps, not a shared filesystem) --
# but all ten gate jobs then run in parallel with each other, only
# serialized behind `setup` itself.
#
# Every job runs on macos-latest with ONE deliberate exception: `visual`, the
# first Linux job in this workflow. It runs on ubuntu-latest inside the pinned
# mcr.microsoft.com/playwright:v1.63.0-noble container, because screenshot
# baselines are Linux-container artifacts only (D-22; docs/adr/0023-design-system-and-reduced-motion.md,
# "Screenshot platform") -- a macOS runner would render different pixels.
# Locally the identical run is `sh scripts/ci/visual-in-container.sh`.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  setup:
    name: Setup (frozen-lockfile install)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

  format:
    name: Format (Biome)
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run format check
        run: pnpm run ci:format

  lint:
    name: Lint (Biome)
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm run ci:lint

  boundaries:
    name: Import boundaries (REPO-03)
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run import-boundary lint
        run: pnpm run ci:boundaries

  backstop:
    name: Boundary grep backstop
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run literal grep backstop
        run: pnpm run ci:backstop

  obsidianmd:
    name: Obsidian plugin policy (REPO-05/REPO-06)
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run eslint-plugin-obsidianmd against packages/plugin
        run: pnpm run ci:obsidianmd

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm run ci:typecheck

  test:
    name: Test
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm run ci:test

  privacy:
    name: Owner-denylist privacy scan (PRIV-01/PRIV-02)
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run owner-denylist privacy scan
        run: pnpm run ci:privacy

  images:
    name: Tracked-image allowlist (PRIV-04)
    needs: setup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run tracked-image allowlist gate
        run: pnpm run ci:images

  # The one Linux job (see the header). The container image tag is pinned to
  # the @playwright/test version in the lockfile; bump both together and
  # regenerate every baseline in its own commit.
  visual:
    name: Visual regression (UI-08, Linux container)
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Enable corepack
        run: corepack enable
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate
      # No native module is exercised by this job, so install scripts are
      # skipped (the same install visual-in-container.sh runs locally).
      - name: Install dependencies (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare every widget cell against the committed Linux baselines
        run: pnpm run ci:visual
      # Diagnostics only: the job has already failed when this runs.
      - name: Upload Playwright diff output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: test-results/

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: macos-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
