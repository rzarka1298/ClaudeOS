<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget harness</title>
    <!-- Local files only (T-03-06): the production stylesheet, then the frozen
         font stack Playwright also injects through stylePath. -->
    <!-- The contrast guard only (visual/contrast.spec.ts): `?host=light|dark` loads a
         stand-in for Obsidian's own control and theme rules BEFORE the production stylesheet,
         the order Obsidian uses. Without the parameter nothing changes. -->
    <script>
      (function () {
        var base = new URLSearchParams(location.search).get("host");
        if (base === "light" || base === "dark") {
          document.documentElement.classList.add("theme-" + base);
          document.write('<link rel="stylesheet" href="./obsidian-base.css">');
        }
      })();
    </script>
    <link rel="stylesheet" href="./dist/styles.css" />
    <link rel="stylesheet" href="./harness-fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- A classic script, not type="module": Chromium blocks module scripts on
         file:// origins, so build.mjs emits an iife. -->
    <script src="./dist/main.js"></script>
  </body>
</html>
